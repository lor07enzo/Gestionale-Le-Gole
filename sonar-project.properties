# Configurazione SonarQube Cloud (sonarcloud.io) — vedi sezione 13 di CLAUDE.md.
# projectKey/organization vanno verificati/corretti con i valori esatti mostrati da SonarQube
# Cloud dopo aver importato questo repository (di norma coincidono con "owner_repo" e "owner"
# in minuscolo, ma vanno confermati in dashboard prima del primo run).
sonar.projectKey=lor07enzo_Gestionale-Le-Gole
sonar.organization=lor07enzo

sonar.projectName=Gestionale Le Gole

# Backend Django (analizzato con copertura pytest-cov) + frontend Expo/React Native.
sonar.sources=le-gole-be,le-gole-fe/app,le-gole-fe/src
sonar.tests=le-gole-be/users/test,le-gole-be/struttura/test,le-gole-be/prenotazioni/test

# sonar.sources=le-gole-be include per costruzione anche le sottocartelle test/ di ogni app
# (users/test, struttura/test, prenotazioni/test) — senza escluderle qui da sonar.sources
# risultano indicizzate due volte (una come sorgente, una come sonar.tests sotto), errore
# "can't be indexed twice" dello scanner. sonar.exclusions filtra solo il set di sonar.sources,
# quindi questi stessi percorsi restano comunque analizzati come test tramite sonar.tests sopra.
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/htmlcov/**,\
  le-gole-fe/components/ui/**,\
  le-gole-be/users/test/**,\
  le-gole-be/struttura/test/**,\
  le-gole-be/prenotazioni/test/**

# components/ui/ è codice generato dalla CLI di gluestack-ui (pattern "copy-paste", sezione 4 di
# CLAUDE.md), non scritto/mantenuto da noi — escluso dall'analisi per non generare rumore su
# codice non nostro.

sonar.python.version=3.13
sonar.python.coverage.reportPaths=le-gole-be/coverage.xml
