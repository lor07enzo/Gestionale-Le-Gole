# Configurazione SonarQube Cloud (sonarcloud.io) — vedi sezione 13 di CLAUDE.md.
# projectKey/organization confermati in dashboard dopo l'import del repository.
sonar.projectKey=lor07enzo_Gestionale-Le-Gole
sonar.organization=lor07enzo

sonar.projectName=Gestionale Le Gole

# Backend Django (analizzato con copertura pytest-cov) + frontend Expo/React Native.
sonar.sources=le-gole-be,le-gole-fe/app,le-gole-fe/src
# le-gole-fe/src/**/__tests__ (introdotta il 2026-08-10, jest-expo + @testing-library/react-native,
# sezione 9 di CLAUDE.md) segue lo stesso pattern "un modulo, un file dedicato" già usato lato
# backend, quindi gli stessi due percorsi (utils/__tests__, context/__tests__) sono l'unico posto
# dove aggiungere una futura nuova cartella __tests__ sotto src/.
sonar.tests=\
  le-gole-be/users/test,\
  le-gole-be/struttura/test,\
  le-gole-be/prenotazioni/test,\
  le-gole-fe/src/utils/__tests__,\
  le-gole-fe/src/context/__tests__

# sonar.sources=le-gole-be include per costruzione anche le sottocartelle test/ di ogni app
# (users/test, struttura/test, prenotazioni/test), e sonar.sources=le-gole-fe/src include allo
# stesso modo le cartelle __tests__/ sotto src/ — senza escluderle qui da sonar.sources risultano
# indicizzate due volte (una come sorgente, una come sonar.tests sopra), errore "can't be indexed
# twice" dello scanner. sonar.exclusions filtra solo il set di sonar.sources, quindi questi stessi
# percorsi restano comunque analizzati come test tramite sonar.tests sopra.
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/htmlcov/**,\
  le-gole-fe/components/ui/**,\
  le-gole-be/users/test/**,\
  le-gole-be/struttura/test/**,\
  le-gole-be/prenotazioni/test/**,\
  le-gole-fe/src/utils/__tests__/**,\
  le-gole-fe/src/context/__tests__/**

# components/ui/ è codice generato dalla CLI di gluestack-ui (pattern "copy-paste", sezione 4 di
# CLAUDE.md), non scritto/mantenuto da noi — escluso dall'analisi per non generare rumore su
# codice non nostro.

sonar.python.version=3.13
# Un file XML per app invece di un unico report combinato: coverage.py sovrascrive le classi con
# lo stesso nome (models.py/views.py/... esistono in tutte e 3 le app) quando le scrive in un
# solo XML, perdendo silenziosamente i dati di due app su tre (vedi ci.yml per i dettagli
# completi del bug). sonar.python.coverage.reportPaths accetta una lista separata da virgole.
sonar.python.coverage.reportPaths=\
  le-gole-be/coverage-prenotazioni.xml,\
  le-gole-be/coverage-struttura.xml,\
  le-gole-be/coverage-users.xml

# Report di coverage frontend (jest --coverage, sezione 9 di CLAUDE.md — introdotto il
# 2026-08-10), generato in CI dal job frontend-tests e scaricato dal job sonarqube prima dello
# scan (ci.yml). Nessun collectCoverageFrom esplicito nella config Jest: solo i moduli davvero
# richiesti dai test attuali finiscono nel report (piscinaMappa.ts, storage.ts,
# StaffNotificationsContext.tsx), non l'intero albero le-gole-fe/**.
sonar.javascript.lcov.reportPaths=le-gole-fe/coverage/lcov.info

# le-gole-fe/app/** (le schermate) resta escluso dal calcolo della percentuale: nessun test le
# monta per intero (richiederebbe trasformare gluestack-ui/react-native-css, sezione 9), quindi
# senza questa esclusione la stragrande maggioranza del frontend conterebbe comunque come "0%
# coperta" nel denominatore, ricreando l'effetto di diluizione già osservato e corretto in passato
# (coverage progetto scesa allo 0,2%, sezione 13 di CLAUDE.md) — a differenza di prima, però, le-gole-fe/src/**
# NON è più escluso: i tre file con test reali (sopra) ora contribuiscono con dati di coverage
# veri, e i file di src/ ancora privi di test contano onestamente come 0% invece di sparire dal
# calcolo. sonar.coverage.exclusions esclude solo dal calcolo della percentuale, non dall'analisi:
# bug/code smell/duplicazioni sulle schermate restano comunque rilevati. Da restringere ulteriormente
# (o rimuovere) man mano che la copertura di app/ e del resto di src/ cresce.
#
# Le voci le-gole-be/* rispecchiano l'omit= di le-gole-be/.coveragerc (sezione 9 di CLAUDE.md):
# backend/* (settings/urls/asgi/wsgi), manage.py, apps.py e admin.py sono boilerplate non
# testato intenzionalmente (non logica applicativa) — senza rispecchiare la stessa esclusione
# qui, Sonar li conterebbe come "0% coperti" nel denominatore della percentuale, abbassandola
# artificialmente anche a bug dei path risolto (vedi ci.yml, step "Fix coverage.xml source
# paths"). migrations/** e test/** non ripetute qui: già del tutto fuori da sonar.sources sopra.
#
# le-gole-fe/src/components/** riaggiunto il 2026-08-11: dopo la rimozione dell'esclusione
# generale su le-gole-fe/** (sopra), il new-code coverage di SonarQube Cloud è crollato al 34%
# (Quality Gate in ERROR) — non per una regressione reale, ma perché una sessione con molte
# modifiche UI (menu staff, card piscina, footer, ecc.) è finita nel denominatore senza alcun
# test a fronte: testare i componenti gluestack-ui non è ancora pianificato (richiederebbe
# configurare la trasformazione Jest di NativeWind/react-native-css, sezione 9 di CLAUDE.md,
# finora deliberatamente rimandato per il rischio su una libreria ancora alpha). `utils/` e
# `context/` restano invece dentro il calcolo: hanno già una copertura reale (piscinaMappa.ts,
# storage.ts, StaffNotificationsContext.tsx) che vale la pena continuare a vedere riflessa nella
# percentuale. Da rimuovere di nuovo quando (e se) i componenti avranno una suite di test propria.
sonar.coverage.exclusions=\
  le-gole-fe/app/**,\
  le-gole-fe/src/components/**,\
  le-gole-be/backend/**,\
  le-gole-be/manage.py,\
  **/apps.py,\
  **/admin.py
