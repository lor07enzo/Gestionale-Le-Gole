# Configurazione SonarQube Cloud (sonarcloud.io).
sonar.projectKey=lor07enzo_Gestionale-Le-Gole
sonar.organization=lor07enzo

sonar.projectName=Gestionale Le Gole

sonar.sources=le-gole-be,le-gole-fe/app,le-gole-fe/src
sonar.tests=\
  le-gole-be/users/test,\
  le-gole-be/struttura/test,\
  le-gole-be/prenotazioni/test,\
  le-gole-be/menu/test,\
  le-gole-fe/src/utils/__tests__,\
  le-gole-fe/src/context/__tests__

# I percorsi di sonar.tests sono già inclusi per costruzione in sonar.sources: senza escluderli
# qui verrebbero indicizzati due volte ("can't be indexed twice"). sonar.exclusions filtra solo
# sonar.sources, quindi restano comunque analizzati come test tramite sonar.tests sopra.
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/htmlcov/**,\
  le-gole-fe/components/ui/**,\
  le-gole-be/users/test/**,\
  le-gole-be/struttura/test/**,\
  le-gole-be/prenotazioni/test/**,\
  le-gole-be/menu/test/**,\
  le-gole-fe/src/utils/__tests__/**,\
  le-gole-fe/src/context/__tests__/**

# components/ui/ è codice generato dalla CLI di gluestack-ui, non mantenuto da noi.

sonar.python.version=3.13
# Un XML per app: coverage.py sovrascrive le classi omonime tra app se scritte in un solo XML combinato.
sonar.python.coverage.reportPaths=\
  le-gole-be/coverage-prenotazioni.xml,\
  le-gole-be/coverage-struttura.xml,\
  le-gole-be/coverage-users.xml,\
  le-gole-be/coverage-menu.xml

sonar.javascript.lcov.reportPaths=le-gole-fe/coverage/lcov.info

# app/** e components/** esclusi dal calcolo della percentuale (nessun test li monta per intero),
# altrimenti diluirebbero la coverage reale di utils/ e context/. Solo dal calcolo, non
# dall'analisi: bug/code smell restano comunque rilevati. Le voci le-gole-be/* rispecchiano
# l'omit= di .coveragerc (boilerplate non applicativo).
sonar.coverage.exclusions=\
  le-gole-fe/app/**,\
  le-gole-fe/src/components/**,\
  le-gole-be/backend/**,\
  le-gole-be/manage.py,\
  **/apps.py,\
  **/admin.py
