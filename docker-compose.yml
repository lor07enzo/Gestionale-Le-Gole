services:
  db:
    image: postgres:17
    restart: unless-stopped
    # .env.prod, non .env: database "produzione" containerizzato, separato dal Postgres nativo di sviluppo.
    env_file:
      - ./le-gole-be/.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433: Postgres gira normalmente anche in locale fuori da Docker, 5432:5432
      # fallirebbe se già in ascolto. Il backend nel container usa comunque la porta interna 5432.
      - "5433:5432"
    healthcheck:
      # $$ (non $) fa arrivare la variabile d'ambiente dentro il container, non interpolata da Compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./le-gole-be
    restart: unless-stopped
    # Ordine rilevante: .env fornisce la base, .env.prod è caricato dopo e sovrascrive le sole
    # chiavi DB_* con le credenziali del database containerizzato.
    env_file:
      - ./le-gole-be/.env
      - ./le-gole-be/.env.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Bind mount per lo sviluppo: le modifiche sull'host si riflettono senza ricostruire l'immagine.
      - ./le-gole-be:/app

volumes:
  postgres_data:
