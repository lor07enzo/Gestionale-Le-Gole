# Blueprint Render per il solo backend (Django + gunicorn, sezione 10 di CLAUDE.md) — il
# database è Neon (Postgres gestito esterno, non un servizio Render), il frontend Expo/React
# Native non è coperto da questo file (sezione 12 di CLAUDE.md). Import come "Blueprint" dalla
# dashboard Render puntando a questo repo.
services:
  - name: le-gole-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./le-gole-be/Dockerfile
    dockerContext: ./le-gole-be
    healthCheckPath: /api/v1/struttura/inventario-piscina/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Wildcard sul dominio Render: qualunque sottodominio *.onrender.com assegnato al
      # servizio combacia (Django supporta il pattern ".dominio" per un host jolly). Va
      # ristretto all'host esatto (o aggiunto un dominio custom) quando si esce dalla sola
      # fase di test.
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # Frontend in produzione (EAS Hosting, sezione 14) — unica origine autorizzata a chiamare
      # l'API da un browser. Sostituisce CORS_ALLOW_ALL_ORIGINS (era True, TODO da tempo).
      - key: CORS_ALLOWED_ORIGINS
        value: https://le-gole-fe.expo.app
      # Credenziali Neon (sezione 12) — da inserire manualmente in dashboard dopo aver creato
      # il progetto Neon, mai salvate in questo file.
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_CONN_HEALTH_CHECKS
        value: "True"
      # Riusa la connessione TLS a Neon tra richieste invece di riaprirla ogni volta (default
      # Django CONN_MAX_AGE=0) — senza, ogni singola richiesta paga per intero l'handshake TLS
      # verso un DB remoto, misurato ~1,5s costanti anche a backend caldo (causa principale di
      # lentezza percepita). 60s, sotto ai 300s di scale-to-zero di default di Neon, come da
      # raccomandazione ufficiale Neon per Django (CONN_MAX_AGE + CONN_HEALTH_CHECKS).
      - key: DB_CONN_MAX_AGE
        value: "60"
      # Piano free: RAM limitata, meno worker gunicorn del default Docker locale (3, sezione 10).
      - key: GUNICORN_WORKERS
        value: "2"
      - key: RESEND_API_KEY
        sync: false
      # Placeholder finché il frontend non ha un URL web reale (sezione 7/12) — i deep link
      # legole://... non risolvono in un browser, vanno sostituiti con l'URL https effettivo
      # non appena il frontend viene ospitato da qualche parte.
      - key: FRONTEND_ACTIVATION_URL
        sync: false
      - key: FRONTEND_RESET_URL
        sync: false
