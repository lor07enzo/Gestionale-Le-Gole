# Blueprint Render per il solo backend: il database è Supabase (esterno), il frontend non è coperto da questo file.
services:
  - name: le-gole-backend
    type: web
    runtime: docker
    # Starter: elimina lo sleep dopo inattività (il polling notifiche teneva comunque sveglio il servizio).
    plan: starter
    dockerfilePath: ./le-gole-be/Dockerfile
    dockerContext: ./le-gole-be
    healthCheckPath: /api/v1/struttura/inventario-piscina/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Host esatti, non il wildcard *.onrender.com: senza uno dei due Django risponde 400 DisallowedHost.
      - key: ALLOWED_HOSTS
        value: le-gole-backend.onrender.com,api.osterialegole.com
      # Uniche origini autorizzate a chiamare l'API da un browser.
      - key: CORS_ALLOWED_ORIGINS
        value: https://osterialegole.com,https://www.osterialegole.com
      # Credenziali Supabase, da inserire manualmente in dashboard, mai salvate qui. Se la
      # connessione diretta (porta 5432) fallisce, è probabile che l'host sia solo IPv6: usare
      # il Session Pooler di Supabase (IPv4), con DB_USER nel formato postgres.<project-ref>.
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_CONN_HEALTH_CHECKS
        value: "True"
      # Riusa la connessione TLS al DB tra richieste invece di riaprirla ogni volta (default Django CONN_MAX_AGE=0).
      - key: DB_CONN_MAX_AGE
        value: "60"
      # RAM limitata (512 MB): meno worker gunicorn del default Docker locale.
      - key: GUNICORN_WORKERS
        value: "2"
      - key: RESEND_API_KEY
        sync: false
      # Credenziali Cloudinary (storage foto prodotti, sezione 1) — dashboard Cloudinary, mai salvate qui.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Da impostare manualmente su https://osterialegole.com/activate e /reset-password.
      - key: FRONTEND_ACTIVATION_URL
        sync: false
      - key: FRONTEND_RESET_URL
        sync: false
