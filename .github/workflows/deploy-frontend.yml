name: Deploy Frontend (EAS Hosting)

# Solo su push a main, e solo quando cambia davvero qualcosa sotto le-gole-fe/ — a differenza di
# ci.yml (test backend, sezione 9 di CLAUDE.md), qui non ha senso ripubblicare un identico
# artefatto statico ad ogni commit che tocca solo il backend.
on:
  push:
    branches: [main]
    paths:
      - "le-gole-fe/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    name: Export + deploy to EAS Hosting (produzione)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: le-gole-fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: le-gole-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      # EXPO_PUBLIC_API_BASE_URL viene letta da le-gole-fe/.env.production (tracciato in git,
      # sezione 14 di CLAUDE.md — non un segreto, è solo l'URL pubblico del backend Render).
      # expo export gira in modalità production di default, quindi la legge senza bisogno di
      # impostare nulla qui.
      - name: Export static web build
        run: npx expo export -p web

      # expo export genera sempre <html lang="en"> anche se l'app è interamente in italiano
      # (web.output non è "static" — passarci introdurrebbe un regresso, il <title> della scheda
      # sparirebbe, sezione 14 di CLAUDE.md) — un lang errato fa sì che Google Traduttore rilevi
      # la pagina come inglese e traduca/storpi singole parole italiane. Corretto in lang="it" +
      # meta notranslate come doppia protezione, riusando lo stesso script di deploy:web.
      - name: Fix HTML lang + notranslate meta
        run: node scripts/fix-html-lang.js

      # Chromium per il browser reale usato da scripts/verify-web-build.js. --with-deps installa
      # anche le librerie di sistema richieste dal runner ubuntu-latest (altrimenti Chromium non
      # parte affatto in CI).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Blocca il deploy se il bundle appena esportato va in crash su una qualunque delle pagine
      # chiave (bug di non-determinismo di Metro sull'ordine dei moduli tra ambienti diversi,
      # sezione 14 di CLAUDE.md — a volte il getter lazy di FlatList risolve a `undefined` e
      # l'intera app mostra una pagina bianca). Il fallimento di questo step interrompe la run
      # PRIMA che lo step di deploy sottostante venga eseguito: mai più una build rotta pubblicata
      # senza che nessuno se ne accorga.
      - name: Verify exported build has no crash on load
        run: node scripts/verify-web-build.js

      # eas-cli è una devDependency pinnata (package.json), non npx eas-cli@latest: in CI serve
      # una versione riproducibile, non l'ultima disponibile al momento della run.
      - name: Deploy to EAS Hosting (production)
        run: npx eas-cli deploy --prod --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
