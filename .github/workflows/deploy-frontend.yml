name: Deploy Frontend (Netlify)

# Solo su push a main, e solo quando cambia davvero qualcosa sotto le-gole-fe/ — a differenza di
# ci.yml (test backend, sezione 9 di CLAUDE.md), qui non ha senso ripubblicare un identico
# artefatto statico ad ogni commit che tocca solo il backend.
on:
  push:
    branches: [main]
    paths:
      - "le-gole-fe/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    name: Export + deploy to Netlify (produzione)
    # windows-latest, non ubuntu-latest (sezione 14 CLAUDE.md): il crash da require circolare
    # react-native-web/react-native-css (NativeWind v5 alpha) dipende dall'ordine con cui Metro
    # valuta i moduli, a sua volta sensibile a come il filesystem scansiona node_modules — mai
    # riprodotto su Windows in nessuno dei numerosi episodi osservati (deploy manuale da locale
    # sempre pulito), sistematicamente intermittente su Linux. Non risolve il bug alla radice
    # (resta un problema reale di NativeWind/react-native-css, ancora alpha), ma allinea il runner
    # CI all'unico ambiente che si è dimostrato affidabile finora. Lo step di verifica sotto resta
    # comunque attivo come rete di sicurezza.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: le-gole-fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: le-gole-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      # EXPO_PUBLIC_API_BASE_URL viene letta da le-gole-fe/.env.production (tracciato in git,
      # sezione 14 di CLAUDE.md — non un segreto, è solo l'URL pubblico del backend Render).
      # expo export gira in modalità production di default, quindi la legge senza bisogno di
      # impostare nulla qui.
      - name: Export static web build
        run: npx expo export -p web

      # expo export genera sempre <html lang="en"> anche se l'app è interamente in italiano
      # (web.output non è "static" — passarci introdurrebbe un regresso, il <title> della scheda
      # sparirebbe, sezione 14 di CLAUDE.md) — un lang errato fa sì che Google Traduttore rilevi
      # la pagina come inglese e traduca/storpi singole parole italiane. Corretto in lang="it" +
      # meta notranslate come doppia protezione, riusando lo stesso script di deploy:web.
      - name: Fix HTML lang + notranslate meta
        run: node scripts/fix-html-lang.js

      # Chromium per il browser reale usato da scripts/verify-web-build.js. Niente --with-deps qui
      # (installa librerie di sistema via apt, solo per runner Linux/Debian-based) — su
      # windows-latest il browser scaricato da Playwright è già autosufficiente.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Blocca il deploy se il bundle appena esportato va in crash su una qualunque delle pagine
      # chiave (bug di non-determinismo di Metro sull'ordine dei moduli tra ambienti diversi,
      # sezione 14 di CLAUDE.md — a volte il getter lazy di FlatList risolve a `undefined` e
      # l'intera app mostra una pagina bianca). Il fallimento di questo step interrompe la run
      # PRIMA che lo step di deploy sottostante venga eseguito: mai più una build rotta pubblicata
      # senza che nessuno se ne accorga.
      - name: Verify exported build has no crash on load
        run: node scripts/verify-web-build.js

      # netlify-cli è una devDependency pinnata (package.json), non npx netlify-cli@latest: in CI
      # serve una versione riproducibile, non l'ultima disponibile al momento della run.
      # NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID sono lette automaticamente dalla CLI (nessun flag
      # --auth/--site necessario) — stesso pattern già usato per EXPO_TOKEN quando il deploy
      # andava su EAS Hosting (sezione 14 di CLAUDE.md, migrato a Netlify per il dominio custom
      # gratuito: EAS Hosting lo richiede solo a partire dal piano Starter, $19/mese).
      # --no-build: il sito Netlify ha un "build command" configurato via dashboard UI
      # (npm run deploy:web, impostato dal wizard di onboarding) — senza questo flag `netlify
      # deploy` lo rieseguirebbe prima di pubblicare, richiamando se stesso ricorsivamente
      # (npm run deploy:web finisce a sua volta con `netlify deploy`), fallendo con "Command
      # failed with exit code 1: npm run deploy:web". dist/ è già la build verificata dagli step
      # sopra, non c'è alcun bisogno che Netlify ne generi una propria.
      - name: Deploy to Netlify (production)
        run: npx netlify deploy --prod --dir=dist --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
