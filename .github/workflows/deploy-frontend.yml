name: Deploy Frontend (Netlify)

# Solo su push a main, e solo quando cambia davvero qualcosa sotto le-gole-fe/.
on:
  push:
    branches: [main]
    paths:
      - "le-gole-fe/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    name: Export + deploy to Netlify (produzione)
    # windows-latest: un crash da require circolare react-native-web/react-native-css (NativeWind
    # v5 alpha) è intermittente su Linux ma mai riprodotto su Windows. Non risolve il bug alla
    # radice; lo step di verifica sotto resta comunque attivo come rete di sicurezza.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: le-gole-fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: le-gole-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      # EXPO_PUBLIC_API_BASE_URL viene letta da le-gole-fe/.env.production (tracciato in git, non un segreto).
      - name: Export static web build
        run: npx expo export -p web

      # expo export genera sempre <html lang="en">: senza correzione, Google Traduttore rileva
      # la pagina come inglese e traduce/storpia il testo italiano.
      - name: Fix HTML lang + notranslate meta
        run: node scripts/fix-html-lang.js

      # Niente --with-deps: su windows-latest il browser scaricato da Playwright è già autosufficiente.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Blocca il deploy se il bundle esportato va in crash su una pagina chiave, prima che lo
      # step di deploy sottostante venga eseguito.
      - name: Verify exported build has no crash on load
        run: node scripts/verify-web-build.js

      # --no-build: il sito Netlify ha un build command configurato via dashboard che rilancerebbe
      # se stesso ricorsivamente senza questo flag. dist/ è già la build verificata sopra.
      - name: Deploy to Netlify (production)
        run: npx netlify deploy --prod --dir=dist --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
