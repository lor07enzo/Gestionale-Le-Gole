name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: le_gole_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: le_gole_ci_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-only-secret-key-never-used-outside-this-workflow
      DEBUG: "True"
      RESEND_API_KEY: dummy-key-not-used-in-tests
      FRONTEND_ACTIVATION_URL: legole://activate
      FRONTEND_RESET_URL: legole://reset-password

    defaults:
      run:
        working-directory: le-gole-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Storico completo (non uno shallow clone): richiesto dall'analisi SonarQube Cloud
          # nel job successivo, che riusa questo stesso checkout.
          fetch-depth: 0

      # WeasyPrint (generazione biglietto PDF, sezione 2 di CLAUDE.md) richiede queste librerie
      # di sistema per Pango/fontconfig, stesse del Dockerfile di produzione (sezione 10).
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fontconfig fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip   
          cache-dependency-path: le-gole-be/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest

      # coverage.py, quando misura più app Django sorelle nella stessa passata (users, struttura,
      # prenotazioni — ciascuna un package Python di primo livello, nessun __init__.py comune le
      # unisce), scrive nell'XML combinato un "package" vuoto (".") IDENTICO per ognuna: il writer
      # Cobertura tiene le classi in un dict chiavato solo sul nome file, quindi file omonimi tra
      # un'app e l'altra (models.py/views.py/serializers.py/urls.py/__init__.py esistono in tutte
      # e tre) si sovrascrivono a vicenda — nell'XML finale sopravvive un solo "models.py" su tre,
      # gli altri due scompaiono silenziosamente (bug di coverage.py stesso, non di SonarQube: il
      # report testuale term-missing è corretto, solo lo scrittore XML perde dati). Root-caused
      # osservando che l'unico file con nome davvero unico nell'intero backend (users/permissions.py)
      # era l'unico a comparire con un dato di coverage sensato su SonarQube Cloud.
      # Fix: un file XML separato per app, rigenerato dagli stessi dati già raccolti da pytest
      # sopra (nessun secondo run dei test) filtrando con --include — ogni file misura una sola
      # app alla volta, quindi non c'è alcuna collisione di nomi e i path restano pienamente
      # qualificati (verificato: 255+158+226=639 statement, 255+156+226=637 coperti, combaciano
      # esattamente con l'unico XML combinato... quando quello non perdeva dati).
      - name: Generate one coverage XML per app (avoids coverage.py's same-filename collision)
        run: |
          coverage xml --data-file=.coverage --include="prenotazioni/*" -o coverage-prenotazioni.xml
          coverage xml --data-file=.coverage --include="struttura/*" -o coverage-struttura.xml
          coverage xml --data-file=.coverage --include="users/*" -o coverage-users.xml

      # Ognuno dei tre XML ha filename già qualificati rispetto alla cwd di pytest (le-gole-be,
      # es. "prenotazioni/models.py") ma un <source></source> vuoto — SonarQube risolve i path
      # relativi alla project base dir (la root del repo, sonar.sources=le-gole-be,..., sezione 13
      # di CLAUDE.md), quindi senza questo step cercherebbe "prenotazioni/models.py" invece di
      # "le-gole-be/prenotazioni/models.py". Corretto valorizzando <source> su "le-gole-be".
      - name: Fix coverage XML source paths for SonarQube (backend in una sottocartella del repo)
        run: sed -i 's#<source></source>#<source>le-gole-be</source>#' coverage-*.xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            le-gole-be/coverage-prenotazioni.xml
            le-gole-be/coverage-struttura.xml
            le-gole-be/coverage-users.xml

  sonarqube:
    name: SonarQube Cloud analysis
    needs: backend-tests
    runs-on: ubuntu-latest
    # I fork non hanno accesso ai secret del repo (SONAR_TOKEN) — una PR da fork farebbe
    # comunque fallire lo step di scan con un errore di autenticazione poco chiaro.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: le-gole-be

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
