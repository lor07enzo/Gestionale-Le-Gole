name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, sviluppo]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: le_gole_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: le_gole_ci_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-only-secret-key-never-used-outside-this-workflow
      DEBUG: "True"
      RESEND_API_KEY: dummy-key-not-used-in-tests
      FRONTEND_ACTIVATION_URL: legole://activate
      FRONTEND_RESET_URL: legole://reset-password
      # Mai usate per un upload reale: conftest.py forza lo storage su filesystem locale in test.
      CLOUDINARY_CLOUD_NAME: dummy-cloud-not-used-in-tests
      CLOUDINARY_API_KEY: dummy-key-not-used-in-tests
      CLOUDINARY_API_SECRET: dummy-secret-not-used-in-tests

    defaults:
      run:
        working-directory: le-gole-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Storico completo: richiesto dall'analisi SonarQube Cloud nel job successivo.
          fetch-depth: 0

      # Librerie di sistema per WeasyPrint (Pango/fontconfig), stesse del Dockerfile di produzione.
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fontconfig fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip   
          cache-dependency-path: le-gole-be/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest

      # coverage.py, misurando più app Django sorelle nella stessa passata, scrive un XML
      # combinato dove file omonimi tra app (models.py, views.py...) si sovrascrivono a vicenda —
      # bug di coverage.py, non di SonarQube. Fix: un XML separato per app, dagli stessi dati già
      # raccolti da pytest sopra, così non c'è collisione di nomi.
      - name: Generate one coverage XML per app (avoids coverage.py's same-filename collision)
        run: |
          coverage xml --data-file=.coverage --include="prenotazioni/*" -o coverage-prenotazioni.xml
          coverage xml --data-file=.coverage --include="struttura/*" -o coverage-struttura.xml
          coverage xml --data-file=.coverage --include="users/*" -o coverage-users.xml
          coverage xml --data-file=.coverage --include="menu/*" -o coverage-menu.xml

      # <source> vuoto nei tre XML: SonarQube risolve i path relativi alla root del repo, quindi
      # senza questo step cercherebbe "prenotazioni/models.py" invece di "le-gole-be/prenotazioni/models.py".
      - name: Fix coverage XML source paths for SonarQube (backend in una sottocartella del repo)
        run: sed -i 's#<source></source>#<source>le-gole-be</source>#' coverage-*.xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            le-gole-be/coverage-prenotazioni.xml
            le-gole-be/coverage-struttura.xml
            le-gole-be/coverage-users.xml
            le-gole-be/coverage-menu.xml

  frontend-tests:
    name: Frontend tests (jest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: le-gole-fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: le-gole-fe/package-lock.json

      # legacy-peer-deps=true è già in le-gole-fe/.npmrc, necessario per le dipendenze alpha/preview.
      - name: Install dependencies
        run: npm ci

      - name: Run jest with coverage
        run: npx jest --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: le-gole-fe/coverage/lcov.info

  sonarqube:
    name: SonarQube Cloud analysis
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    # I fork non hanno accesso ai secret del repo: una PR da fork farebbe fallire lo scan comunque.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: le-gole-be

      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: le-gole-fe/coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
