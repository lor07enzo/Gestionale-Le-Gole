name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: le_gole_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: le_gole_ci_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-only-secret-key-never-used-outside-this-workflow
      DEBUG: "True"
      RESEND_API_KEY: dummy-key-not-used-in-tests
      FRONTEND_ACTIVATION_URL: legole://activate
      FRONTEND_RESET_URL: legole://reset-password

    defaults:
      run:
        working-directory: le-gole-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Storico completo (non uno shallow clone): richiesto dall'analisi SonarQube Cloud
          # nel job successivo, che riusa questo stesso checkout.
          fetch-depth: 0

      # WeasyPrint (generazione biglietto PDF, sezione 2 di CLAUDE.md) richiede queste librerie
      # di sistema per Pango/fontconfig, stesse del Dockerfile di produzione (sezione 10).
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fontconfig fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip   
          cache-dependency-path: le-gole-be/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: le-gole-be/coverage.xml

  sonarqube:
    name: SonarQube Cloud analysis
    needs: backend-tests
    runs-on: ubuntu-latest
    # I fork non hanno accesso ai secret del repo (SONAR_TOKEN) — una PR da fork farebbe
    # comunque fallire lo step di scan con un errore di autenticazione poco chiaro.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: le-gole-be

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
